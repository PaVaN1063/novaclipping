services:
  backend:
    build: .
    container_name: novaclipping-backend
    ports:
      - "8000:8000"
    environment:
      # Nova Clipping: how many clip projects run at the same time on this
      # laptop (more are queued, not refused). Raise it on a stronger machine.
      - MAX_CONCURRENT_JOBS=3
    extra_hosts:
      # lets the backend reach the Nova Clipping website running on Windows
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: novaclipping-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: novaclipping-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend
